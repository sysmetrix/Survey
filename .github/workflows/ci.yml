name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 헤드리스 브라우저(Edge/Chrome)가 없는 ubuntu-latest 에 Chromium 을 설치하고 실행 경로를 받아온다.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: 로컬 서버 시작 (백그라운드)
        run: python3 -m http.server 8000 &
      - name: 브라우저 E2E
        env:
          E2E_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run e2e
      - name: 실패 시 화면·PDF·HWPX 산출물 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: out/browser
          retention-days: 7
