name: Supabase keepalive

# 무료 플랜은 7일간 API 호출이 없으면 프로젝트가 자동 일시정지된다(재단 내부 도구라 접속이 뜸한 주가
# 있을 수 있음). 매주 한 번 읽기 전용 엔드포인트에 핑을 보내 그 일이 없도록 한다. 실패해도 다른
# CI 잡을 막지 않게 별도 워크플로로 둔다. URL·anon key 는 비밀이 아니다(js/auth/api.js 에도 그대로
# 커밋돼 있음 — 실제 보호는 서버 쪽 Row Level Security).
on:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC(한국 시간 낮 12시)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://unrtgdymimluqxkvzucp.supabase.co/auth/v1/health")
          echo "응답 코드: $code"
          if [ "$code" -ge 500 ]; then exit 1; fi
