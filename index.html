<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3B5A7A">
  <meta name="description" content="설문 엑셀로 통계 분석, 청소년 사업 성과지표 달성 평가, 한글(HWPX) 보고서와 발표 슬라이드를 브라우저 안에서 만듭니다.">
  <title>설문 분석 · 평가 도구</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <meta name="apple-mobile-web-app-title" content="설문분석">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 공유 미리보기(카카오톡·슬랙·페이스북 등)에 뜨는 썸네일·제목.
       og:image 와 og:url 은 반드시 절대 주소여야 하고(상대 경로는 카카오가 못 읽음), 그림은 icons/og-image.png (1200×630, tools/make-og-image.mjs 가 생성).
       카톡은 한 번 읽은 미리보기를 한동안 기억하므로, 문구·그림을 바꾼 뒤에는 카카오 개발자 도구의 '디버거 → 캐시 초기화'를 한 번 돌려야 새로 보인다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="설문 분석 · 평가 도구">
  <meta property="og:title" content="설문 분석 · 평가 도구">
  <!-- 카톡 카드는 설명을 두 줄까지만 보여주고 나머지는 잘라낸다(폭 250px 남짓 · 한 줄에 20자 안팎) — 위 name="description"(검색엔진용)보다 짧게 둔다 -->
  <meta property="og:description" content="엑셀 설문을 통계 분석하고 한글(HWPX) 결과보고서·발표자료까지 만듭니다">
  <meta property="og:url" content="https://sysmetrix.github.io/Survey/">
  <meta property="og:image" content="https://sysmetrix.github.io/Survey/icons/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="설문 분석 · 평가 도구 — 엑셀 설문을 통계 분석해 한글 결과보고서까지 만드는 도구">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="vendor/fonts/pretendard-gov/pretendard-gov-dynamic-subset.css">
  <link rel="stylesheet" href="css/app.css?v=5.47.9">
  <!-- css/present.css(발표 화면 전용)는 발표·발표 편집 화면에 처음 들어갈 때 js/main.js 가 동적으로 붙인다 -->
  <script src="js/boot-check.js"></script>
  <script src="vendor/papaparse-5.4.1.min.js" defer></script>
  <script type="module" src="js/main.js?v=5.47.9"></script>
</head>
<body>
  <button class="skip no-print" data-act="skip">본문 바로가기</button>
  <header class="topbar no-print">
    <a class="brand" href="#/load" aria-label="설문 분석 · 평가 도구 처음 화면">
      <img class="logo" src="icons/favicon.svg" width="32" height="32" alt="" aria-hidden="true">
      <span><b>설문 분석 · 평가 도구</b></span>
    </a>
    <nav id="steps" class="stepper" aria-label="진행 단계"></nav>
    <div class="top-actions">
      <span id="net" class="chip warn" role="status" hidden></span>
      <button id="settingsBtn" class="icon-btn" data-act="goto" data-to="settings" title="로컬 설정" aria-label="로컬 설정"></button>
      <button id="undoBtn" class="icon-btn" data-act="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled></button>
      <button id="redoBtn" class="icon-btn" data-act="redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행" disabled></button>
      <button id="historyBtn" class="icon-btn" data-act="goto" data-to="history" title="작업 내역" aria-label="작업 내역"></button>
      <button id="presentBtn" class="btn sm" data-act="goto" data-to="present" data-sub="1" title="분석 결과 발표 모드" disabled></button>
      <button id="installBtn" class="btn sm ghost" data-act="install" hidden></button>
      <button id="themeBtn" class="icon-btn" data-act="theme"></button>
      <button id="ver" class="ver" data-act="whats-new" title="앱 버전"></button>
    </div>
  </header>
  <main id="main" class="container" tabindex="-1"></main>
  <footer class="foot no-print"><span>모든 분석은 이 브라우저 안에서만 처리되며 파일은 외부로 전송되지 않습니다</span><span>·</span><span data-act="admin-entry">by Sysmetrix</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="snack" class="snack" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="busy" role="status" aria-live="polite" hidden><div class="busy-box"><div class="spinner"></div><div class="busy-msg"></div></div></div>
  <noscript><p style="padding:20px">이 도구는 JavaScript가 필요합니다.</p></noscript>
</body>
</html>
